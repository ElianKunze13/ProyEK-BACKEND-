spring.application.name=portofolioEK

# ==============================================
# CONFIGURACIÓN DE BASE DE DATOS (PostgreSQL)
# ==============================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Dialecto de Hibernate para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ==============================================
# SEGURIDAD Y JWT
# ==============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ==============================================
# CONFIGURACIÓN DE IMAGEKIT.IO
# ==============================================
# Obtén estos valores de tu dashboard de ImageKit
imagekit.url.endpoint=${IMAGEKIT_URL_ENDPOINT}
imagekit.public.key=${IMAGEKIT_PUBLIC_KEY}
imagekit.private.key=${IMAGEKIT_PRIVATE_KEY}

# ==============================================
# CONFIGURACIÓN MULTIPART PARA SPRING BOOT
# ==============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# ==============================================
# CONFIGURACIÓN DE EMAIL (Gmail)
# ==============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.main.allow-circular-references=true

# Email del dueño del portfolio
portfolio.owner.email=${OWNER_EMAIL}

# ==============================================
# CONFIGURACIÓN DE PUERTO PARA LA NUBE
# ==============================================
server.port=${PORT:8080}